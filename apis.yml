aid: bloom-energy
name: Bloom Energy
description: 'Bloom Energy Corporation (NYSE: BE) is a San Jose, California hardtech
  company that designs and manufactures solid-oxide fuel cell "Energy Server" platforms
  which generate electricity on-site from natural gas, biogas, or hydrogen through
  an electrochemical process rather than combustion. Its modular systems deliver resilient,
  always-on power for data centers, manufacturing, healthcare, utilities, and critical
  infrastructure, can be deployed in roughly 90 days, and scale from single units to
  hundreds of megawatts. Bloom also builds high-temperature solid-oxide electrolyzers
  for low-cost hydrogen production. The company is tracked in the API Evangelist network
  as a hardtech portfolio company; it publishes no public developer API surface at
  this time.'
